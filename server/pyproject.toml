[project]
name = "spectre-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = ["faster-whisper>=1.1"]
kokoro = ["kokoro>=0.9.4"]
chatterbox = ["chatterbox-tts==0.1.7"]  # pins torch 2.6 and transformers 5.2
dev = ["pytest>=8", "pytest-asyncio>=0.24", "websockets>=12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
